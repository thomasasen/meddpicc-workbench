name: Roadmap 2 branch formatting and Pages sync

on:
  push:
    branches:
      - feat/roadmap2-risks-actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/roadmap2-risks-actions
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Format
        run: npm run format
      - name: Sync Pages root
        run: npm run pages:sync
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format and sync Pages root"
          git push origin HEAD:feat/roadmap2-risks-actions
