name: Verify migration branch once

on:
  push:
    branches:
      - feat/project-migration-010-020

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/project-migration-010-020

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Formatieren
        run: npm run format

      - name: Linting
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Production Build und Pages-Root synchronisieren
        run: npm run pages:sync

      - name: Pages-Root prüfen
        run: npm run pages:check

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Tests
        run: npm run test:e2e

      - name: Verifizierten Stand committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests index.html assets package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: verifizierten Migrationsstand aktualisieren"
          git push origin HEAD:feat/project-migration-010-020
