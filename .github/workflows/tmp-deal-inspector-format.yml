name: Temporary Deal Inspector format sync

on:
  push:
    branches:
      - feat/deal-inspector-v01

permissions:
  contents: write

jobs:
  format-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/deal-inspector-v01

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Formatieren und Pages synchronisieren
        run: |
          npm run format
          npm run pages:sync

      - name: Änderungen committen
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: Deal Inspector formatieren und Pages synchronisieren"
          git push
