name: Einmalige Bereinigung grosser Screenshot-Artefakte
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup-old-ci:
    if: ${{ github.event.workflow_run.id == 42271527599 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Zu grosse Screenshot-ZIPs aus dem alten CI-Lauf loeschen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name=="ui-qs-screenshots" and .size_in_bytes > 31457280) | .id' | while read -r id; do
            echo "Deleting oversized legacy screenshot artifact $id"
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
          done
