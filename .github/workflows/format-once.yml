name: Format branch once

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Feature-Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/schema-foundation

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Dateien formatieren
        run: npm run format

      - name: Formatierung committen
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: Prettier Baseline anwenden"
          git push origin HEAD:feat/schema-foundation
