name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-quality:
    if: github.event_name == 'pull_request' && (github.event.pull_request.draft == false || startsWith(github.head_ref, 'feature/ux-report-redesign-'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: PDF-Abhängigkeit im Feature-Branch locken
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock PDF report dependency"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Business-Case-Dateien normalisieren
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          npx prettier --write src/domain/softwarePayback.ts src/domain/businessCaseScenarios.ts src/domain/businessCaseScenarios.test.ts src/domain/businessCase.ts src/domain/businessCase.test.ts src/domain/paybackChart.ts src/domain/paybackChart.test.ts src/domain/paybackChartAreas.ts src/domain/paybackChartAreas.test.ts src/domain/paybackContinuation.ts src/domain/paybackContinuation.test.ts src/report/softwareBusinessCasePdf.ts src/report/softwareBusinessCasePdf.test.ts src/report/customerBusinessCasePdf.ts src/report/customerBusinessCasePdf.test.ts src/components/SoftwareBalanceChart.vue src/components/SoftwarePaybackPanel.vue tests/e2e/software-payback.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format business case PDF and upgraded value chart"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Metric Builder Codeformat vor den Quality Gates normalisieren
        if: startsWith(github.head_ref, 'feature/metric-builder')
        run: |
          npx prettier --write src/domain/metricBuilder.ts src/domain/metricBuilder.test.ts src/domain/metricBuilderHandoff.ts src/domain/metricBuilderHandoff.test.ts src/report/metricBuilderPdf.ts src/views/MetricBuilderView.vue src/router/index.ts src/views/HomeView.vue src/views/QuickPaybackView.vue src/components/SoftwarePaybackPanel.vue tests/e2e/metric-builder.spec.ts tests/e2e/quick-payback.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format Metric Builder implementation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi


      - name: Cost of Delay Dateien vor Quality Gates formatieren
        if: startsWith(github.head_ref, 'feature/cost-of-delay')
        run: |
          npx prettier --write src/domain/costOfDelay.ts src/domain/costOfDelay.test.ts src/domain/costOfDelayHandoff.ts src/report/costOfDelayPdf.ts src/views/CostOfDelayView.vue src/views/MetricBuilderView.vue src/router/index.ts src/views/HomeView.vue src/styles/costOfDelay.css tests/e2e/cost-of-delay.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format Cost of Delay implementation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Value Bridge Codeformat vor Quality Gates normalisieren
        if: startsWith(github.head_ref, 'feature/value-bridge')
        run: |
          npx prettier --write src/domain/valueBridge.ts src/domain/valueBridgeHandoff.ts src/report/valueBridgePdf.ts src/views/ValueBridgeView.vue src/views/MetricBuilderView.vue src/views/CostOfDelayView.vue src/components/SoftwarePaybackPanel.vue src/views/HomeView.vue src/router/index.ts src/styles/valueBridge.css tests/valueBridge.test.ts tests/e2e/value-bridge.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format Value Bridge implementation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Redesign-Dateien vor den Quality Gates formatieren
        if: startsWith(github.head_ref, 'feature/ux-report-redesign-')
        run: |
          npx prettier --write src/App.vue src/main.ts src/views/ChecklistView.vue src/views/QuickPaybackView.vue src/components/AnnualBenefitComparison.vue src/report/reportChrome.ts src/report/reportChrome.test.ts src/report/valueBridgePdf.ts src/report/metricBuilderPdf.ts src/report/costOfDelayPdf.ts src/report/softwareBusinessCasePdf.ts src/report/customerBusinessCasePdf.ts tests/e2e/redesign-foundations.spec.ts src/views/MetricBuilderView.vue src/views/CostOfDelayView.vue src/components/ToolStepNavigation.vue src/report/reportText.ts src/report/reportText.test.ts tests/e2e/tool-step-navigation.spec.ts tests/e2e/redesign-viewport-matrix.spec.ts src/report/customerBusinessCasePdf.test.ts tests/e2e/cost-of-delay.spec.ts src/views/ValueBridgeView.vue src/styles/valueBridge.css src/views/ChampionKnowledgeView.vue src/views/CompetitionKnowledgeView.vue src/views/DecisionCriteriaKnowledgeView.vue src/views/DecisionProcessKnowledgeView.vue src/views/DiscoveryCallKnowledgeView.vue src/views/EconomicBuyerKnowledgeView.vue src/views/MetricsKnowledgeView.vue src/views/PainImplicationKnowledgeView.vue src/views/PaperProcessKnowledgeView.vue src/components/KnowledgeSectionNav.vue tests/e2e/knowledge-section-navigation.spec.ts src/report/report-pagination-stress.test.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: normalize redesign foundations"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: Production Build als Artefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build
          path: dist
          if-no-files-found: error

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run test:e2e

      - name: PDF-Drucklayout als echte Bildseiten prüfen
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          report="$(find test-results -type f -name 'business-case-qa-desktop-chromium.pdf' -print -quit)"
          if [ -z "$report" ]; then
            echo "::error::Kein heruntergeladener PDF-Originalbericht gefunden."
            exit 1
          fi
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          pdfinfo "$report" | head -18
          pdftoppm -f 1 -l 1 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-cover
          pdftoppm -f 2 -l 2 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-finance
          pdftoppm -f 3 -l 3 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-metrics
          total="$(pdfinfo "$report" | awk '/^Pages:/{print $2}')"
          method_page="$((total - 1))"
          pdftoppm -f "$method_page" -l "$method_page" -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-method
          pdftoppm -f "$total" -l "$total" -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-scenarios
          customer="$(find test-results -type f -name 'business-case-customer-desktop-chromium.pdf' -print -quit)"
          if [ -z "$customer" ]; then
            echo "::error::Kein heruntergeladener Kundenbericht gefunden."
            exit 1
          fi
          customer_pages="$(pdfinfo "$customer" | awk '/^Pages:/{print $2}')"
          test "$customer_pages" = 4 || { echo "::error::Kundenbericht muss genau 4 Seiten enthalten"; exit 1; }
          pdftoppm -f 1 -l 1 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-cover
          pdftoppm -f 2 -l 2 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-economics
          pdftoppm -f 3 -l 3 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-decision
          pdftoppm -f 4 -l 4 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-scenarios
          pdftotext -layout "$customer" test-results/rendered/business-case-customer.txt
          grep -q 'Ihre Investition im Überblick' test-results/rendered/business-case-customer.txt
          grep -q 'Wann rechnet sich Ihr Vorhaben' test-results/rendered/business-case-customer.txt
          grep -q 'Tiefster rechnerischer Saldo' test-results/rendered/business-case-customer.txt
          grep -q 'Wirtschaftlicher Ausgleich' test-results/rendered/business-case-customer.txt
          grep -q 'Gestrichelt: Beispiel bei gleichbleibendem monatlichen Nettobeitrag' test-results/rendered/business-case-customer.txt
          if grep -q 'Kosten und Nutzen im direkten Vergleich' test-results/rendered/business-case-customer.txt; then
            echo "::error::Alte Balkengrafik im Kunden-Summary gefunden."
            exit 1
          fi
          grep -q 'So entsteht der wirtschaftliche Nutzen' test-results/rendered/business-case-customer.txt
          grep -q 'Die nächsten Schritte für Ihr Vorhaben' test-results/rendered/business-case-customer.txt
          grep -q 'Wie belastbar ist die Wirtschaftlichkeit' test-results/rendered/business-case-customer.txt
          grep -q 'Konservativ' test-results/rendered/business-case-customer.txt
          grep -q 'Optimistisch' test-results/rendered/business-case-customer.txt
          if grep -Eiq 'Economic Buyer|Champion|Verkäuferannahme|MEDDPICC|keine Freigabe|Kunden-Metric' test-results/rendered/business-case-customer.txt; then
            echo "::error::Internes Vertriebs- oder Freigabevokabular im Kunden-PDF."
            exit 1
          fi
          pdftotext -layout "$report" test-results/rendered/business-case-report.txt
          grep -q 'Wirtschaftlicher Business Case' test-results/rendered/business-case-report.txt
          grep -q 'Kundensituation und Zielbild' test-results/rendered/business-case-report.txt
          grep -q 'Verkäuferannahme' test-results/rendered/business-case-report.txt
          grep -q 'NICHT ANGERECHNET' test-results/rendered/business-case-report.txt
          # Jede Original-PDF-Seite rendern; nicht nur ausgewählte Titelseiten.
          pdftoppm -scale-to 1150 -png "$report" test-results/rendered/finance-all
          pdftoppm -scale-to 1150 -png "$customer" test-results/rendered/customer-all
          selected="$(find test-results -type f -name 'scenario-selected-customer-desktop-chromium.pdf' -print -quit)"
          test -s "$selected" || { echo "::error::PDF des ausgewählten konservativen Falls fehlt"; exit 1; }
          pdftoppm -scale-to 1150 -png "$selected" test-results/rendered/selected-all
          pdftotext -layout "$selected" test-results/rendered/selected-conservative.txt
          grep -q 'BERECHNETER VERLAUF: KONSERVATIV' test-results/rendered/selected-conservative.txt
          grep -q 'Nicht erreicht' test-results/rendered/selected-conservative.txt
          grep -q 'Wie belastbar ist die Wirtschaftlichkeit' test-results/rendered/selected-conservative.txt
          for name in business-case-report-cover.png business-case-report-finance.png business-case-report-metrics.png business-case-report-method.png business-case-report-scenarios.png business-case-customer-cover.png business-case-customer-economics.png business-case-customer-decision.png business-case-customer-scenarios.png; do
            test -s "test-results/rendered/$name" || exit 1
          done

      - name: Metric Builder PDF tatsaechlich als Bildseiten rendern und pruefen
        if: startsWith(github.head_ref, 'feature/metric-builder')
        run: |
          report="$(find test-results -type f -name 'metric-builder-brief-desktop-chromium.pdf' -print -quit)"
          test -s "$report" || { echo "::error::Original-PDF des Metric Builders fehlt"; exit 1; }
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          pdfinfo "$report" | head -18
          pages="$(pdfinfo "$report" | awk '/^Pages:/{print $2}')"
          test "$pages" = 1 || { echo "::error::Der kurze Metric-Steckbrief muss auf einer Seite lesbar sein"; exit 1; }
          pdftoppm -scale-to 1300 -png "$report" test-results/rendered/metric-builder-brief-all
          pdftotext -layout "$report" test-results/rendered/metric-builder-brief.txt
          grep -q 'METRIC-STECKBRIEF' test-results/rendered/metric-builder-brief.txt
          grep -q 'Wirtschaftliche Wirkung' test-results/rendered/metric-builder-brief.txt
          if grep -Eiq 'Economic Buyer|Champion|MEDDPICC|M1-Proof-Point|Verkäuferannahme|Coaching Score' test-results/rendered/metric-builder-brief.txt; then
            echo "::error::Interne Fachbegriffe im Kunden-Steckbrief"; exit 1
          fi
          find test-results/rendered -name 'metric-builder-brief-all-*.png' -size +0c | grep -q .


      - name: Cost of Delay PDF Originalseiten rendern
        if: startsWith(github.head_ref, 'feature/cost-of-delay')
        run: |
          report="$(find test-results -type f -name 'cost-of-delay-desktop-chromium.pdf' -print -quit)"
          test -s "$report" || { echo "::error::Cost of Delay PDF fehlt"; exit 1; }
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          pdfinfo "$report" | head -18
          pdftotext -layout "$report" test-results/rendered/cost-of-delay-pdf.txt
          grep -q 'COST OF DELAY' test-results/rendered/cost-of-delay-pdf.txt
          grep -q 'Ausgangssituation' test-results/rendered/cost-of-delay-pdf.txt
          grep -q 'Nachvollziehbarkeit' test-results/rendered/cost-of-delay-pdf.txt
          if grep -Eiq 'Coaching.Score|MEDDPICC.Score|Verkäuferbewertung' test-results/rendered/cost-of-delay-pdf.txt; then
            echo "::error::Interner Score im Kundenbericht"; exit 1
          fi
          pdftoppm -scale-to 1300 -png "$report" test-results/rendered/cost-of-delay-pdf
          test "$(find test-results/rendered -name 'cost-of-delay-pdf-*.png' -size +0c | wc -l)" -ge 1

      - name: Value Bridge Original PDF Bildseiten rendern
        if: startsWith(github.head_ref, 'feature/value-bridge')
        run: |
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          count=0
          while IFS= read -r -d '' report; do
            name="$(basename "$report" .pdf)"
            pdfinfo "$report" | grep '^Pages:'
            pdftoppm -scale-to 1400 -png "$report" "test-results/rendered/$name"
            count=$((count+1))
          done < <(find test-results -type f -name 'value-bridge-*.pdf' -print0)
          test "$count" -ge 2 || { echo "::error::Value-Bridge-Original-PDFs fehlen"; exit 1; }
          test "$(find test-results/rendered -type f -name 'value-bridge-*.png' -size +0c | wc -l)" -ge 2

      - name: Redesign Original-PDFs komplett in Bildseiten rendern
        if: startsWith(github.head_ref, 'feature/ux-report-redesign-')
        run: |
          set -euo pipefail
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          for name in \
            business-case-customer-desktop-chromium \
            business-case-qa-desktop-chromium \
            metric-builder-brief-desktop-chromium \
            cost-of-delay-desktop-chromium \
            value-bridge-service-desktop-chromium; do
            report="$(find test-results -type f -name "$name.pdf" -print -quit)"
            test -s "$report" || { echo "::error::Fehlendes Original-PDF: $name"; exit 1; }
            pages="$(pdfinfo "$report" | awk '/^Pages:/ {print $2}')"
            test "$pages" -ge 1
            pdftoppm -scale-to 1400 -png "$report" "test-results/rendered/$name"
            count="$(find test-results/rendered -type f -name "$name-*.png" -size +0c | wc -l)"
            test "$count" -eq "$pages" || { echo "::error::Nicht alle Seiten gerendert: $name"; exit 1; }
            echo "$name: $pages Originalseiten gerendert"
          done

      - name: Lange PDF-Berichte rendern und Textextraktion prüfen
        if: startsWith(github.head_ref, 'feature/ux-report-redesign-')
        run: |
          set -euo pipefail
          for kind in metric-builder-long cost-of-delay-long; do
            original="qa-report-artifacts/$kind.pdf"
            test -s "$original" || { echo "::error::Stress-PDF fehlt: $original"; exit 1; }
            pages="$(pdfinfo "$original" | awk '/^Pages:/ {print $2}')"
            test "$pages" -ge 2 || { echo "::error::Stress-PDF nicht mehrseitig: $original"; exit 1; }
            mkdir -p test-results/rendered
            pdftoppm -scale-to 1100 -png "$original" "test-results/rendered/$kind"
            count="$(find test-results/rendered -type f -name "$kind-*.png" -size +0c | wc -l)"
            test "$count" -eq "$pages" || { echo "::error::Nicht alle Langtextseiten gerendert: $kind"; exit 1; }
            pdftotext -layout "$original" "test-results/rendered/$kind.txt"
            test -s "test-results/rendered/$kind.txt"
            echo "$kind: $pages Originalseiten gerendert und Text extrahiert"
          done

      - name: Original-PDFs als prüfbare Artefakte sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-case-example-pdfs
          path: |
            test-results/**/business-case-customer-desktop-chromium.pdf
            test-results/**/metric-builder-brief-*.pdf
            test-results/**/business-case-qa-desktop-chromium.pdf
            test-results/**/scenario-selected-customer-desktop-chromium.pdf
            test-results/**/cost-of-delay-*.pdf
            test-results/**/value-bridge-*.pdf
            qa-report-artifacts/*.pdf
          if-no-files-found: ignore

      - name: UI-QS-Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qs-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: geprüften Build in den Pages-Root synchronisieren
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/sync-pages-root.mjs

      - name: Pages-Build committen
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- index.html assets pages-build.json; then
            echo "Pages-Root ist bereits synchron."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets pages-build.json
          git commit -m "chore: sync GitHub Pages build"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check


      - name: Redesign Browser- und PDF-Originalbilder für Review publizieren
        if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/ux-report-redesign-')
        run: |
          set -euo pipefail
          mkdir -p docs/review-screenshots/redesign
          for source in test-results/rendered/*.png; do
            test -s "$source" || continue
            cp "$source" "docs/review-screenshots/redesign/$(basename "$source")"
          done
          for name in \
            quick-payback-result \
            software-payback-result \
            metric-builder-result \
            cost-of-delay-result \
            value-bridge-money; do
            for viewport in desktop mobile; do
              source="$(find test-results -type f -name "$name-$viewport-chromium.png" -print -quit)"
              if [ -n "$source" ] && [ -s "$source" ]; then
                cp "$source" "docs/review-screenshots/redesign/$(basename "$source")"
              fi
            done
          done
          # Die neue vollständige Routenmatrix statt nur eines ausgewählten Screens publizieren.
          find test-results -type f \( -name '*-375-*.png' -o -name '*-1440-*.png' \) -print | while IFS= read -r source; do
            test -s "$source" || continue
            cp "$source" "docs/review-screenshots/redesign/$(basename "$source")"
          done
          git add docs/review-screenshots/redesign
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test(redesign): publish original screen and complete PDF page renderings"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Value Bridge Originalscreenshots und alle gerenderten PDF Seiten publizieren
        if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/value-bridge')
        run: |
          mkdir -p docs/review-screenshots
          for name in value-bridge-money-desktop-chromium.png value-bridge-money-mobile-chromium.png value-bridge-open-desktop-chromium.png value-bridge-open-mobile-chromium.png; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            test -s "$source" || { echo "::error::Value-Bridge-Screenshot fehlt: $name"; exit 1; }
            cp "$source" "docs/review-screenshots/$name"
          done
          for source in test-results/rendered/value-bridge-*.png; do
            test -s "$source" || exit 1
            cp "$source" "docs/review-screenshots/$(basename "$source")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-screenshots
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Value Bridge original screenshots and PDF pages"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Metric Builder Originalscreenshots und gerenderte PDF-Seiten publizieren
        if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/metric-builder')
        run: |
          mkdir -p docs/review-screenshots
          for name in metric-builder-empty-desktop-chromium.png metric-builder-empty-mobile-chromium.png metric-builder-result-desktop-chromium.png metric-builder-result-mobile-chromium.png metric-builder-step-1-desktop-chromium.png metric-builder-step-1-mobile-chromium.png metric-builder-step-2-desktop-chromium.png metric-builder-step-2-mobile-chromium.png; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            test -s "$source" || { echo "::error::Browser-Screenshot fehlt: $name"; exit 1; }
            cp "$source" "docs/review-screenshots/$name"
          done
          for source in test-results/rendered/metric-builder-brief-all-*.png; do
            test -s "$source" || exit 1
            cp "$source" "docs/review-screenshots/$(basename "$source")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-screenshots
          if ! git diff --cached --quiet; then
            git commit -m "test: publish Metric Builder browser and PDF review images"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Abnahmebilder als überprüfbare Einzeldateien bereitstellen
        if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feature/champion-') || startsWith(github.head_ref, 'feature/competition-') || startsWith(github.head_ref, 'feature/quick-payback-') || startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-'))
        run: |
          mkdir -p docs/review-screenshots
          if [[ "${{ github.head_ref }}" == feature/quick-payback-* || "${{ github.head_ref }}" == feature/business-case-* || "${{ github.head_ref }}" == feature/customer-business-case-* ]]; then
            names=(
              quick-payback-empty-desktop-chromium.png
              quick-payback-empty-mobile-chromium.png
              quick-payback-result-desktop-chromium.png
              quick-payback-result-mobile-chromium.png
              software-payback-empty-desktop-chromium.png
              software-payback-empty-mobile-chromium.png
              software-payback-result-desktop-chromium.png
              software-payback-result-mobile-chromium.png
              software-payback-crm-demo-desktop-chromium.png
              software-payback-crm-demo-mobile-chromium.png
              business-case-chart-desktop-chromium.png
              business-case-chart-mobile-chromium.png
              business-case-scenarios-desktop-chromium.png
              business-case-scenarios-mobile-chromium.png
              business-case-report-cover.png
              business-case-report-finance.png
              business-case-report-metrics.png
              business-case-report-method.png
              business-case-report-scenarios.png
              business-case-customer-cover.png
              business-case-customer-economics.png
              business-case-customer-decision.png
              business-case-customer-scenarios.png
            )
          else
            if [[ "${{ github.head_ref }}" == feature/competition-* ]]; then
              topic=competition
            else
              topic=champion
            fi
            names=(
              "$topic-knowledge-desktop-chromium.png"
              "$topic-knowledge-mobile-chromium.png"
              "$topic-checklist-desktop-chromium.png"
              "$topic-checklist-mobile-chromium.png"
            )
          fi
          for name in "${names[@]}"; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            if [ -z "$source" ]; then
              echo "::error::Playwright-Screenshot fehlt: $name"
              exit 1
            fi
            cp "$source" "docs/review-screenshots/$name"
          done
          git add docs/review-screenshots
          if git diff --cached --quiet; then
            echo "Abnahmebilder sind bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: publish browser review screenshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}


      - name: Cost of Delay Originalbilder für visuelle Abnahme veröffentlichen
        if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/cost-of-delay')
        run: |
          mkdir -p docs/review-screenshots
          for name in cost-of-delay-empty-desktop-chromium.png cost-of-delay-empty-mobile-chromium.png cost-of-delay-result-desktop-chromium.png cost-of-delay-result-mobile-chromium.png; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            test -s "$source" || { echo "::error::Screenshot fehlt: $name"; exit 1; }
            cp "$source" "docs/review-screenshots/$name"
          done
          for source in test-results/rendered/cost-of-delay-pdf-*.png; do
            test -s "$source" || { echo "::error::Gerenderte PDF-Seite fehlt"; exit 1; }
            cp "$source" "docs/review-screenshots/$(basename "$source")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/review-screenshots
          if ! git diff --cached --quiet; then
            git commit -m "test: Cost of Delay Desktop, Mobil und PDF-Seiten für Abnahme"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  main-pages-integrity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Production Build erzeugen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check
