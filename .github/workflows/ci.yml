name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-quality:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: PDF-Abhängigkeit im Feature-Branch locken
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock PDF report dependency"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Business-Case-Dateien normalisieren
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          npx prettier --write src/domain/softwarePayback.ts src/domain/businessCaseScenarios.ts src/domain/businessCaseScenarios.test.ts src/domain/businessCase.ts src/domain/businessCase.test.ts src/domain/paybackChart.ts src/domain/paybackChart.test.ts src/domain/paybackChartAreas.ts src/domain/paybackChartAreas.test.ts src/domain/paybackContinuation.ts src/domain/paybackContinuation.test.ts src/report/softwareBusinessCasePdf.ts src/report/softwareBusinessCasePdf.test.ts src/report/customerBusinessCasePdf.ts src/report/customerBusinessCasePdf.test.ts src/components/SoftwareBalanceChart.vue src/components/SoftwarePaybackPanel.vue tests/e2e/software-payback.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format business case PDF and upgraded value chart"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: Production Build als Artefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build
          path: dist
          if-no-files-found: error

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run test:e2e

      - name: PDF-Drucklayout als echte Bildseiten prüfen
        if: startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-')
        run: |
          report="$(find test-results -type f -name 'business-case-qa-desktop-chromium.pdf' -print -quit)"
          if [ -z "$report" ]; then
            echo "::error::Kein heruntergeladener PDF-Originalbericht gefunden."
            exit 1
          fi
          if ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          mkdir -p test-results/rendered
          pdfinfo "$report" | head -18
          pdftoppm -f 1 -l 1 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-cover
          pdftoppm -f 2 -l 2 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-finance
          pdftoppm -f 3 -l 3 -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-metrics
          total="$(pdfinfo "$report" | awk '/^Pages:/{print $2}')"
          method_page="$((total - 1))"
          pdftoppm -f "$method_page" -l "$method_page" -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-method
          pdftoppm -f "$total" -l "$total" -scale-to 1300 -png -singlefile "$report" test-results/rendered/business-case-report-scenarios
          customer="$(find test-results -type f -name 'business-case-customer-desktop-chromium.pdf' -print -quit)"
          if [ -z "$customer" ]; then
            echo "::error::Kein heruntergeladener Kundenbericht gefunden."
            exit 1
          fi
          customer_pages="$(pdfinfo "$customer" | awk '/^Pages:/{print $2}')"
          test "$customer_pages" = 4 || { echo "::error::Kundenbericht muss genau 4 Seiten enthalten"; exit 1; }
          pdftoppm -f 1 -l 1 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-cover
          pdftoppm -f 2 -l 2 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-economics
          pdftoppm -f 3 -l 3 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-decision
          pdftoppm -f 4 -l 4 -scale-to 1300 -png -singlefile "$customer" test-results/rendered/business-case-customer-scenarios
          pdftotext -layout "$customer" test-results/rendered/business-case-customer.txt
          grep -q 'Ihre Investition im Überblick' test-results/rendered/business-case-customer.txt
          grep -q 'Wann rechnet sich Ihr Vorhaben' test-results/rendered/business-case-customer.txt
          grep -q 'Tiefster rechnerischer Saldo' test-results/rendered/business-case-customer.txt
          grep -q 'Wirtschaftlicher Ausgleich' test-results/rendered/business-case-customer.txt
          grep -q 'Gestrichelt: Beispiel bei gleichbleibendem monatlichen Nettobeitrag' test-results/rendered/business-case-customer.txt
          if grep -q 'Kosten und Nutzen im direkten Vergleich' test-results/rendered/business-case-customer.txt; then
            echo "::error::Alte Balkengrafik im Kunden-Summary gefunden."
            exit 1
          fi
          grep -q 'So entsteht der wirtschaftliche Nutzen' test-results/rendered/business-case-customer.txt
          grep -q 'Die nächsten Schritte für Ihr Vorhaben' test-results/rendered/business-case-customer.txt
          grep -q 'Wie belastbar ist die Wirtschaftlichkeit' test-results/rendered/business-case-customer.txt
          grep -q 'Konservativ' test-results/rendered/business-case-customer.txt
          grep -q 'Optimistisch' test-results/rendered/business-case-customer.txt
          if grep -Eiq 'Economic Buyer|Champion|Verkäuferannahme|MEDDPICC|keine Freigabe|Kunden-Metric' test-results/rendered/business-case-customer.txt; then
            echo "::error::Internes Vertriebs- oder Freigabevokabular im Kunden-PDF."
            exit 1
          fi
          pdftotext -layout "$report" test-results/rendered/business-case-report.txt
          grep -q 'Wirtschaftlicher Business Case' test-results/rendered/business-case-report.txt
          grep -q 'Kundensituation und Zielbild' test-results/rendered/business-case-report.txt
          grep -q 'Verkäuferannahme' test-results/rendered/business-case-report.txt
          grep -q 'NICHT ANGERECHNET' test-results/rendered/business-case-report.txt
          # Jede Original-PDF-Seite rendern; nicht nur ausgewählte Titelseiten.
          pdftoppm -scale-to 1150 -png "$report" test-results/rendered/finance-all
          pdftoppm -scale-to 1150 -png "$customer" test-results/rendered/customer-all
          selected="$(find test-results -type f -name 'scenario-selected-customer-desktop-chromium.pdf' -print -quit)"
          test -s "$selected" || { echo "::error::PDF des ausgewählten konservativen Falls fehlt"; exit 1; }
          pdftoppm -scale-to 1150 -png "$selected" test-results/rendered/selected-all
          pdftotext -layout "$selected" test-results/rendered/selected-conservative.txt
          grep -q 'BERECHNETER VERLAUF: KONSERVATIV' test-results/rendered/selected-conservative.txt
          grep -q 'Nicht erreicht' test-results/rendered/selected-conservative.txt
          grep -q 'Wie belastbar ist die Wirtschaftlichkeit' test-results/rendered/selected-conservative.txt
          # Kompakte Zweitrenderings sind nur für die zusätzliche visuelle QA vorgesehen.
          pdftoppm -scale-to 760 -png "$report" test-results/rendered/qa-finance
          pdftoppm -scale-to 760 -png "$customer" test-results/rendered/qa-customer
          pdftoppm -scale-to 760 -png "$selected" test-results/rendered/qa-selected
          for name in business-case-report-cover.png business-case-report-finance.png business-case-report-metrics.png business-case-report-method.png business-case-report-scenarios.png business-case-customer-cover.png business-case-customer-economics.png business-case-customer-decision.png business-case-customer-scenarios.png; do
            test -s "test-results/rendered/$name" || exit 1
          done

      - name: Original-PDFs als prüfbare Artefakte sichern
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-case-example-pdfs
          path: |
            test-results/**/business-case-customer-desktop-chromium.pdf
            test-results/**/business-case-qa-desktop-chromium.pdf
            test-results/**/scenario-selected-customer-desktop-chromium.pdf
          if-no-files-found: ignore

      - name: UI-QS-Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qs-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: geprüften Build in den Pages-Root synchronisieren
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/sync-pages-root.mjs

      - name: Pages-Build committen
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- index.html assets pages-build.json; then
            echo "Pages-Root ist bereits synchron."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets pages-build.json
          git commit -m "chore: sync GitHub Pages build"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check


      - name: Abnahmebilder als überprüfbare Einzeldateien bereitstellen
        if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feature/champion-') || startsWith(github.head_ref, 'feature/competition-') || startsWith(github.head_ref, 'feature/quick-payback-') || startsWith(github.head_ref, 'feature/business-case-') || startsWith(github.head_ref, 'feature/customer-business-case-'))
        run: |
          mkdir -p docs/review-screenshots
          if [[ "${{ github.head_ref }}" == feature/quick-payback-* || "${{ github.head_ref }}" == feature/business-case-* || "${{ github.head_ref }}" == feature/customer-business-case-* ]]; then
            names=(
              quick-payback-empty-desktop-chromium.png
              quick-payback-empty-mobile-chromium.png
              quick-payback-result-desktop-chromium.png
              quick-payback-result-mobile-chromium.png
              software-payback-empty-desktop-chromium.png
              software-payback-empty-mobile-chromium.png
              software-payback-result-desktop-chromium.png
              software-payback-result-mobile-chromium.png
              software-payback-crm-demo-desktop-chromium.png
              software-payback-crm-demo-mobile-chromium.png
              business-case-chart-desktop-chromium.png
              business-case-chart-mobile-chromium.png
              business-case-scenarios-desktop-chromium.png
              business-case-scenarios-mobile-chromium.png
              business-case-report-cover.png
              business-case-report-finance.png
              business-case-report-metrics.png
              business-case-report-method.png
              business-case-report-scenarios.png
              business-case-customer-cover.png
              business-case-customer-economics.png
              business-case-customer-decision.png
              business-case-customer-scenarios.png
            )
          else
            if [[ "${{ github.head_ref }}" == feature/competition-* ]]; then
              topic=competition
            else
              topic=champion
            fi
            names=(
              "$topic-knowledge-desktop-chromium.png"
              "$topic-knowledge-mobile-chromium.png"
              "$topic-checklist-desktop-chromium.png"
              "$topic-checklist-mobile-chromium.png"
            )
          fi
          for name in "${names[@]}"; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            if [ -z "$source" ]; then
              echo "::error::Playwright-Screenshot fehlt: $name"
              exit 1
            fi
            cp "$source" "docs/review-screenshots/$name"
          done
          # Temporäre Base64-Previews erlauben die Sichtprüfung über die Text-GitHub-Verbindung.
          base64 -w0 docs/review-screenshots/business-case-scenarios-desktop-chromium.png > docs/review-screenshots/_qa-scenarios-desktop.b64
          base64 -w0 docs/review-screenshots/business-case-scenarios-mobile-chromium.png > docs/review-screenshots/_qa-scenarios-mobile.b64
          base64 -w0 docs/review-screenshots/business-case-customer-scenarios.png > docs/review-screenshots/_qa-pdf-scenarios.b64
          for png in test-results/rendered/qa-finance-*.png test-results/rendered/qa-customer-*.png test-results/rendered/qa-selected-*.png; do
            test -s "$png" || { echo "::error::Visueller PDF-Vorschaurender fehlt: $png"; exit 1; }
            name="$(basename "$png" .png)"
            base64 -w0 "$png" > "docs/review-screenshots/_qa-$name.b64"
          done
          git add docs/review-screenshots
          if git diff --cached --quiet; then
            echo "Abnahmebilder sind bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: publish browser review screenshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  main-pages-integrity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Production Build erzeugen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check
