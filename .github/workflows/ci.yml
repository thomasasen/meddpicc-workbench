name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-quality:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run test:e2e

      - name: UI-QS-Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qs-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

  main-pages-integrity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Production Build erzeugen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check
