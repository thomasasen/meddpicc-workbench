name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-quality:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: PDF-Abhängigkeit im Feature-Branch locken
        if: startsWith(github.head_ref, 'feature/business-case-')
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock PDF report dependency"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Business-Case-Dateien normalisieren
        if: startsWith(github.head_ref, 'feature/business-case-')
        run: |
          npx prettier --write src/domain/businessCase.ts src/domain/businessCase.test.ts src/report/softwareBusinessCasePdf.ts src/report/softwareBusinessCasePdf.test.ts src/components/SoftwareBalanceChart.vue src/components/SoftwarePaybackPanel.vue tests/e2e/software-payback.spec.ts
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format business case PDF and upgraded value chart"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: Production Build als Artefakt bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-build
          path: dist
          if-no-files-found: error

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run test:e2e

      - name: UI-QS-Screenshots bereitstellen
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-qs-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore

      - name: geprüften Build in den Pages-Root synchronisieren
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/sync-pages-root.mjs

      - name: Pages-Build committen
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- index.html assets pages-build.json; then
            echo "Pages-Root ist bereits synchron."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets pages-build.json
          git commit -m "chore: sync GitHub Pages build"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check


      - name: Abnahmebilder als überprüfbare Einzeldateien bereitstellen
        if: github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feature/champion-') || startsWith(github.head_ref, 'feature/competition-') || startsWith(github.head_ref, 'feature/quick-payback-') || startsWith(github.head_ref, 'feature/business-case-'))
        run: |
          mkdir -p docs/review-screenshots
          if [[ "${{ github.head_ref }}" == feature/quick-payback-* || "${{ github.head_ref }}" == feature/business-case-* ]]; then
            names=(
              quick-payback-empty-desktop-chromium.png
              quick-payback-empty-mobile-chromium.png
              quick-payback-result-desktop-chromium.png
              quick-payback-result-mobile-chromium.png
              software-payback-empty-desktop-chromium.png
              software-payback-empty-mobile-chromium.png
              software-payback-result-desktop-chromium.png
              software-payback-result-mobile-chromium.png
              software-payback-crm-demo-desktop-chromium.png
              software-payback-crm-demo-mobile-chromium.png
              business-case-chart-desktop-chromium.png
              business-case-chart-mobile-chromium.png
            )
          else
            if [[ "${{ github.head_ref }}" == feature/competition-* ]]; then
              topic=competition
            else
              topic=champion
            fi
            names=(
              "$topic-knowledge-desktop-chromium.png"
              "$topic-knowledge-mobile-chromium.png"
              "$topic-checklist-desktop-chromium.png"
              "$topic-checklist-mobile-chromium.png"
            )
          fi
          for name in "${names[@]}"; do
            source="$(find test-results -type f -name "$name" -print -quit)"
            if [ -z "$source" ]; then
              echo "::error::Playwright-Screenshot fehlt: $name"
              exit 1
            fi
            cp "$source" "docs/review-screenshots/$name"
          done
          git add docs/review-screenshots
          if git diff --cached --quiet; then
            echo "Abnahmebilder sind bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: publish browser review screenshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  main-pages-integrity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Production Build erzeugen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check
