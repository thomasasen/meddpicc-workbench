name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        run: npm run test:e2e
