name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pr-quality:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Linting ausführen
        run: npm run lint

      - name: Unit Tests ausführen
        run: npm test

      - name: Produktionsbuild prüfen
        run: npm run build

      - name: Production Build für Pages-Sync bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: champion-tester-production-build
          path: dist/
          if-no-files-found: error

      - name: Pages-Root über bestehenden Sync-Mechanismus aktualisieren
        if: github.event.action == 'ready_for_review'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm run pages:sync
          rm -rf /tmp/pages-root
          mkdir -p /tmp/pages-root
          cp index.html pages-build.json /tmp/pages-root/
          cp -a assets /tmp/pages-root/assets

          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          rm -rf assets
          cp /tmp/pages-root/index.html /tmp/pages-root/pages-build.json .
          cp -a /tmp/pages-root/assets ./assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets pages-build.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync pages root for champion tester"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check

      - name: Playwright Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Browser Smoke Tests ausführen
        env:
          PLAYWRIGHT_PREBUILT: '1'
        run: npm run test:e2e

  main-pages-integrity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Production Build erzeugen
        run: npm run build

      - name: veröffentlichten Pages-Root prüfen
        run: npm run pages:check
