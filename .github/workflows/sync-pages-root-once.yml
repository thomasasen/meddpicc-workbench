name: Sync Pages root once

on:
  push:
    branches:
      - feat/roadmap2-evidence-register

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Branch auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/roadmap2-evidence-register

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Production Build in Pages-Root synchronisieren
        run: npm run pages:sync

      - name: generierten Pages-Root committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: Pages-Root aus Production Build aktualisieren"
          git push origin HEAD:feat/roadmap2-evidence-register
